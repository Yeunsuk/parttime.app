spring:
  datasource:
    # admin-tool의 DB_HOST/DB_PORT/... 환경변수와 같은 이름으로 맞췄다 — 기본값은 기존과
    # 동일한 localhost:5432라 값을 안 주면 지금까지와 똑같이 동작한다(하위 호환).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:parttime}
    username: ${DB_USER:parttime}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    naming:
      strategy: com.fasterxml.jackson.databind.PropertyNamingStrategies$LowerCamelCaseStrategy

  web:
    resources:
      cache:
        # 정적 파일(Flutter 웹 번들)에 Cache-Control이 없으면 Spring Security가 기본으로
        # no-store를 붙여서 브라우저가 매번 3MB+ 번들을 통째로 다시 받는다. no-cache로 명시하면
        # 브라우저가 저장은 해두고 매번 Last-Modified로 재확인만 한다(변경 없으면 304, 본문 없음).
        # Flutter 번들은 파일명에 해시가 없어서 max-age를 길게 주면 배포 후에도 옛 버전이 남는다.
        cachecontrol:
          no-cache: true

server:
  port: 8080
  # Flutter 웹 번들(main.dart.js 약 3.4MB)이 압축 없이 나가서 느린 회선에서 로딩이 길었다.
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml,font/otf,font/ttf
    min-response-size: 1024

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000           # 24시간 (ms)
  refresh-expiration: 1209600000 # 14일 (ms)

auth:
  owner-auth-code: ${OWNER_AUTH_CODE}

security:
  login-rate-limit:
    max-retry: 5          # findTimeMinutes 안에 이 횟수 이상 실패하면 차단
    find-time-minutes: 10 # 실패 횟수를 세는 관찰 기간(분)
    ban-time-minutes: 15  # 차단 지속 시간(분)

logging:
  level:
    org.springframework.security: DEBUG