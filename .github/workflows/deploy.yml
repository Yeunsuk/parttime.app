name: Build and push image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require API_BASE_URL secret
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ]; then
            echo "::error::API_BASE_URL secret not set — refusing to build (would bake in an empty base URL). Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter web
        working-directory: front
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build web --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Stage web-flutter for Docker build
        run: |
          rm -rf back/web-flutter
          cp -r front/build/web back/web-flutter

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./back
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_BASE_URL=${{ secrets.API_BASE_URL }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull and restart container
        run: ~/parttime.app/deploy-from-registry.sh
